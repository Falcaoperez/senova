[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["venv", ".venv", ".local", "staticfiles", "**/migrations/**", "**/static/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"SENNOVA/test_settings.py" = ["F403", "F405"]
"SENNOVA/migration_settings.py" = ["F403", "F405"]
"core/settings.py" = ["F403"]

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 120
