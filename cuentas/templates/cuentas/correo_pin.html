<!DOCTYPE html>
<html lang="es">
  <body style="margin:0;
               background:#f5f7f9;
               font:15px Arial,sans-serif;
               color:#193345">
    <div style="max-width:520px;
                margin:35px auto;
                background:white;
                border:1px solid #e3e9ed;
                border-radius:12px;
                padding:32px">
      <p style="color:#237500;font-weight:bold">SENA · GESICOM</p>
      <h1 style="font-size:25px">Recupera tu acceso.</h1>
      <p>Ingresa este PIN en la pantalla de recuperación:</p>
      <p style="font:32px monospace;
                letter-spacing:9px;
                background:#eff8e9;
                padding:20px;
                text-align:center;
                color:#00324d">{{ pin }}</p>
      <p>Caduca en <strong>{{ minutos }} minutos</strong> y solo puede utilizarse una vez.</p>
      <p style="font-size:12px;color:#697b89">Si no solicitaste este cambio, ignora el mensaje. Nunca compartas tu PIN ni tu contraseña.</p>
    </div>
  </body>
</html>
